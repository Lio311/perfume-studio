# XcodeGen spec. Generate with: xcodegen generate  (then open Scanner.xcodeproj)
name: Scanner
options:
  bundleIdPrefix: com.perfumestudio        # TODO(owner): confirm bundle id prefix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"                   # raise to 6 once the owner's Xcode is confirmed
    DEVELOPMENT_TEAM: ""                    # set locally in Xcode (automatic signing); never commit a team id secret
    CODE_SIGN_STYLE: Automatic
packages:
  PackKit:    { path: Packages/PackKit }
  CaptureKit: { path: Packages/CaptureKit }
  MeasureKit: { path: Packages/MeasureKit }
  APIClient:  { path: Packages/APIClient }
  Store:      { path: Packages/Store }
  UIParts:    { path: Packages/UIParts }
targets:
  Scanner:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PackKit
      - package: CaptureKit
      - package: MeasureKit
      - package: APIClient
      - package: Store
      - package: UIParts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "סורק רכיבים"
        CFBundleDevelopmentRegion: he
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit]   # world tracking; LiDAR is not required and must not be added here
        NSCameraUsageDescription: "המצלמה משמשת לצילום ומדידה של רכיבי אריזה (בקבוקים, פקקים, משאבות וקופסאות)."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perfumestudio.scanner
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
      configs:
        Release:
          # DEBUG sample photos stay out of the release bundle.
          EXCLUDED_SOURCE_FILE_NAMES: "measure-bottle.jpg measure-bottle.json measure-cap-side.jpg measure-cap-top.jpg measure-cap.json measure-box-front.jpg measure-box-side.jpg measure-box.json"
schemes:
  Scanner:
    build: { targets: { Scanner: all } }
    test:  { targets: [] }
