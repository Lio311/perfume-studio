name: ios-ci-macos
# On demand only (macOS minutes cost ~10x Linux): label a PR "macos-build" or run manually.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]
    paths: ['ios/**']
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'macos-build')
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project Scanner.xcodeproj -scheme Scanner -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
