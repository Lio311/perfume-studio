name: ios-mactools

# Linux tests for ios/MacTools. The macOS release build runs only when the PR
# carries the macos-build label (same gate as ios-ci-macos). The label is
# removed after a successful macOS build so later pushes do not keep spending
# macOS minutes.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'ios/MacTools/**'
      - '.github/workflows/ios-mactools.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  linux-test:
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    defaults:
      run:
        working-directory: ios/MacTools/Reconstruct
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --parallel

  macos-build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'macos-build')
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/MacTools/Reconstruct
    steps:
      - uses: actions/checkout@v4
      - name: swift build release
        run: swift build -c release
      - name: Remove macos-build label
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label "macos-build"
